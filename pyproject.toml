[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jadenfix-android-simulator"
version = "0.1.0"
description = "Reproducible Android Emulator environments for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jadenfix" }]
keywords = ["android", "emulator", "apple-silicon", "macos", "avd", "adb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
android-sim = "android_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["android_simulator*"]
